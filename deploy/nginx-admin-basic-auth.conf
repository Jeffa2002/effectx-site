# Protect the static-export admin route. Include this inside the HTTPS server
# block before the generic `location /` block.
location = /admin {
    auth_basic "EffectX admin";
    auth_basic_user_file /etc/nginx/admin.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /admin.html =404;
}

location ^~ /admin/ {
    auth_basic "EffectX admin";
    auth_basic_user_file /etc/nginx/admin.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri.html =404;
}
